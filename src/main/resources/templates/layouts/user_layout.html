<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AS-FAST</title>
  <link rel="stylesheet" href="/css/layouts/common.css">
  <link rel="stylesheet" href="/css/layouts/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/layouts/user_layout.css">
  <link rel="stylesheet" href="/css/layouts/user_header.css">

  <th:block layout:fragment="content_css"/>
</head>
<body>
  <div class="user-container">
    <div class="user-header">
      <th:block th:replace="~{layouts/user_header::headerFragment}"/>
    </div>
    <div class="user-content">
      <th:block layout:fragment="content"/>
    </div>
    <div class="user-footer">
      <div>
        <span style="font-weight:700; color:var(--color-text-muted);"><i class="bi bi-tools"></i> AS-FAST</span> &copy; 2026 All Rights Reserved.
      </div>
      <ul class="footer-menu">
        <li><a href="#">이용약관</a></li>
        <li><a href="#">개인정보처리방침</a></li>
        <li><a href="#">고객센터</a></li>
      </ul>
    </div>
  </div>
  <script src="/js/layouts/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <th:block layout:fragment="content_js"/>
</body>
</html>
