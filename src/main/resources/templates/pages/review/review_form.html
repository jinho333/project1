<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<!--이 곳에 link태그로 css파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/review/review_form.css">
</th:block>

<!--아래 block에 html 코드 작성-->
<th:block layout:fragment="content">
  <!-- 리뷰 작성 트리거 (예시) -->
  <div style="text-align:center; padding: 60px 0;">
    <button type="button" class="btn btn-primary btn-lg" onclick="openModal('#review-modal')">
      서비스 리뷰 작성하기
    </button>
  </div>

  <!-- 서비스 리뷰 작성 모달 -->
  <div class="modal-overlay active" id="review-modal">
    <div class="modal-box modal-large review-modal">
      <div class="modal-header">
        <h3>서비스 만족도 평가</h3>
        <span class="close-x" onclick="closeModal('#review-modal')">
          <i class="bi bi-x-lg"></i>
        </span>
      </div>
      <div class="modal-content">
        <form action="/review/submit" method="post" id="review-form">

          <!-- 인사 영역 -->
          <div class="review-hello">
            <div class="clap-icon"><i class="bi bi-hand-thumbs-up-fill"></i></div>
            <h2>수리 서비스는 어떠셨나요?</h2>
            <p class="lead">
              <span class="strong">김철수 엔지니어</span>님의 서비스에 대해 별점을 남겨주세요.
            </p>
          </div>

          <!-- 별점 -->
          <div class="star-rating">
            <input type="radio" name="rate" id="rate5" value="5" checked><label for="rate5"><i class="bi bi-star-fill"></i></label>
            <input type="radio" name="rate" id="rate4" value="4"><label for="rate4"><i class="bi bi-star-fill"></i></label>
            <input type="radio" name="rate" id="rate3" value="3"><label for="rate3"><i class="bi bi-star-fill"></i></label>
            <input type="radio" name="rate" id="rate2" value="2"><label for="rate2"><i class="bi bi-star-fill"></i></label>
            <input type="radio" name="rate" id="rate1" value="1"><label for="rate1"><i class="bi bi-star-fill"></i></label>
          </div>

          <!-- 좋았던 점 -->
          <div class="review-tags">
            <h3>어떤 점이 좋았나요? <span class="multi-tag">다중 선택 가능</span></h3>
            <div class="tag-chips">
              <label class="chip">
                <input type="checkbox" name="tag" value="kind">
                <span><i class="bi bi-emoji-smile"></i> 친절한 응대</span>
              </label>
              <label class="chip">
                <input type="checkbox" name="tag" value="ontime">
                <span><i class="bi bi-clock"></i> 정확한 시간 준수</span>
              </label>
              <label class="chip">
                <input type="checkbox" name="tag" value="clean" checked>
                <span><i class="bi bi-brush"></i> 깔끔한 현장 마무리</span>
              </label>
              <label class="chip">
                <input type="checkbox" name="tag" value="explain">
                <span><i class="bi bi-chat-dots"></i> 상세하고 쉬운 설명</span>
              </label>
              <label class="chip">
                <input type="checkbox" name="tag" value="price">
                <span><i class="bi bi-currency-exchange"></i> 합리적인 수리 비용</span>
              </label>
            </div>
          </div>

          <!-- 상세 리뷰 -->
          <div class="review-text">
            <h3>상세한 후기를 남겨주세요 (선택)</h3>
            <textarea class="form-control" name="content"
              placeholder="기사님의 서비스나 수리 결과에 대해 다른 고객들에게 도움이 될 수 있도록 솔직한 후기를 남겨주세요. (최대 500자)"></textarea>
            <p id="contentP" class="valigate-p invalid"></p>
          </div>

          <!-- 하단 버튼 -->
          <div class="btn-div">
            <button type="button" class="btn btn-secondary btn-lg" onclick="closeModal('#review-modal')">다음에 하기</button>
            <button type="button" class="btn btn-primary btn-lg" onclick="goReview()">리뷰 등록하기</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</th:block>

<!--이 곳에 script태그로 js파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_js">
  <script src="/js/pages/review/review_form.js"></script>
</th:block>
</html>
