<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content">
  <div style="padding: 40px; max-width: 600px; margin: 0 auto;">

    <h2>⚠️ 임시 1단계 폼 (테스트용)</h2>
    <p style="color: #888; margin-bottom: 24px;">
      팀원의 정식 1단계 폼 완성 전까지 사용하는 임시 페이지입니다.
    </p>

    <form action="/reserve/time" method="get"
          style="display: flex; flex-direction: column; gap: 16px;">

      <div>
        <label style="font-weight: 700;">제품</label>
        <select name="product" class="form-control">
          <option value="AC">에어컨</option>
          <option value="OUT">실외기</option>
          <option value="DEHUM">제습기</option>
        </select>
      </div>

      <div>
        <label style="font-weight: 700;">증상</label>
        <textarea name="symptom" class="form-control" rows="4">에어컨이 안 시원하고 미지근한 바람만 나옵니다.</textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 16px;">
        시간 선택하기 →
      </button>
    </form>

  </div>
</th:block>
</html>
