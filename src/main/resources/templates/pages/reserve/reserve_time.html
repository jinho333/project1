<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<!-- CSS -->
<th:block layout:fragment="content_css">
  <!-- FullCalendar 7.1.0 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/theme.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/palettes/blue.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_form.css">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_time.css">
</th:block>

<!-- 본문 -->
<th:block layout:fragment="content">
  <div class="reserve-page">

    <!-- 좌측 : 단계 표시 -->
    <aside class="reserve-side">
      <h2>A/S 예약 신청</h2>
      <p>엔지니어가 방문할<br>원하는 날짜와 시간을 선택해주세요.</p>

      <ul class="steps">
        <li class="step step--done">
          <div class="step__marker"><i class="bi bi-check-lg"></i></div>
          <div>
            <h3 class="step__title">증상 접수</h3>
            <p class="step__desc">입력 완료</p>
          </div>
        </li>
        <li class="step step--active">
          <div class="step__marker">2</div>
          <div>
            <h3 class="step__title">시간 선택</h3>
            <p class="step__desc">원하는 방문 시간을 골라주세요.</p>
          </div>
        </li>
        <li class="step step--upcoming">
          <div class="step__marker">3</div>
          <div>
            <h3 class="step__title">예약 완료</h3>
            <p class="step__desc">엔지니어 배정이 시작됩니다.</p>
          </div>
        </li>
      </ul>
    </aside>

    <!-- 우측 : 캘린더 + 시간 슬롯 -->
    <div class="reserve-main">
      <form action="/reserve/complete" method="post" id="reserve-time-form">

        <input type="hidden" name="modelName" th:value="${reserveDTO.modelName}">
        <input type="hidden" name="symptom" th:value="${reserveDTO.symptom}">
        <input type="hidden" name="categoryNo" th:value="${reserveDTO.categoryNo}">
        <input type="hidden" name="visitAddr" th:value="${reserveDTO.visitAddr}">
        <input type="hidden" name="visitAddrDetail" th:value="${reserveDTO.visitAddrDetail}">

        <!-- 방문 날짜 (JS가 채움) / 시간은 슬롯 라디오(slotNo)로 별도 전송 -->
        <input type="hidden" name="reserveDate" id="reserveDateInput">

        <div class="card card-lg time-wrap">

          <!-- 캘린더 영역 -->
          <div class="calendar-area">
            <h3>방문 날짜를 선택해주세요</h3>
            <!-- FullCalendar가 렌더링될 div (내부에 [<] 제목 [>] 툴바 생성됨) -->
            <div id="calendar"></div>
          </div>

          <!-- 시간 슬롯 영역 -->
          <div class="slot-area">

            <div class="slot-head">
              <div>
                <!-- JS가 날짜를 동적으로 갱신 -->
                <h3 id="slotDateTitle">날짜를 선택해주세요</h3>
                <p>방문 희망 날짜를 선택해주세요. 당일 예약은 불가합니다.</p>
              </div>
            </div>

            <!-- JS가 이 안에 슬롯을 동적으로 생성 -->
            <div class="slot-grid" id="slotGrid"></div>

            <p id="timeP" class="valigate-p invalid"></p>
            <p th:if="${error}" th:text="${error}" style="color:red; font-weight:700;"></p>

            <!-- 하단 버튼 -->
            <div class="form-footer">
              <a href="/reserve/form" class="btn btn-ghost btn-md">
                <i class="bi bi-arrow-left"></i> 이전 단계
              </a>
              <button type="button" class="btn btn-primary btn-lg" onclick="goComplete()">
                예약 확정하기 <i class="bi bi-check-lg"></i>
              </button>
            </div>

          </div>
        </div>
      </form>
    </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <!-- FullCalendar 7.1.0 (모든 플러그인 포함 번들) -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>
  <!-- 한국어 로케일 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/locales-all.global.min.js"></script>
  <!-- 테마 JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/global.js"></script>
  <!-- 커스텀 JS -->
  <script src="/js/pages/reserve/reserve_time.js"></script>
</th:block>
</html>
