<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<!--이 곳에 link태그로 css파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_complete.css">
</th:block>

<!--아래 block에 html 코드 작성-->
<th:block layout:fragment="content">
  <div class="complete-wrap">
    <div class="complete-box card card-lg">
      <div class="check-icon animate-check">
        <i class="bi bi-check-lg"></i>
      </div>

      <h1>예약이 접수되었습니다!</h1>
      <p class="lead">담당 엔지니어가 배정되면 카카오톡 알림을 보내드립니다.</p>

      <!-- 예약 정보 요약 카드 -->
      <div class="summary-box">
        <div class="summary-head">
          <span class="label">접수번호</span>
          <span class="value" th:text="${reserveNo ?: '#AS-98274'}">#AS-98274</span>
        </div>

        <ul class="summary-list">
          <li>
            <span class="label">요청 제품</span>
            <span class="value" th:text="${productName ?: '에어컨 (벽걸이)'}">에어컨 (벽걸이)</span>
          </li>
          <li class="highlight">
            <span class="label">방문 일시</span>
            <span class="value" th:text="${visitDate ?: '2026년 9월 8일(화) 10:00'}">2026년 9월 8일(화) 10:00</span>
          </li>
          <li>
            <span class="label">방문 주소</span>
            <span class="value">
              서울 강남구 테헤란로 123<br>
              <span class="sub">강남아파트 101동 202호</span>
            </span>
          </li>
        </ul>
      </div>

      <div class="btn-div">
        <a href="/" class="btn btn-secondary btn-lg">홈으로 돌아가기</a>
        <a href="/reserve/list" class="btn btn-primary btn-lg">내 예약 확인하기</a>
      </div>
    </div>
  </div>
</th:block>

<!--이 곳에 script태그로 js파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_js">
</th:block>
</html>
