<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<!--이 곳에 link태그로 css파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_complete.css">
</th:block>

<!--아래 block에 html 코드 작성-->
<th:block layout:fragment="content">
  <div class="complete-wrap">
    <div class="complete-box card card-lg">
      <div class="check-icon animate-check">
        <i class="bi bi-check-lg"></i>
      </div>

      <h1>예약이 접수되었습니다!</h1>
      <p class="lead">담당 엔지니어가 배정되면 알림을 보내드립니다.</p>

      <!-- 예약 정보 요약 카드 -->
      <div class="summary-box">
        <div class="summary-head">
          <span class="label">접수번호</span>
          <span class="value" th:text="${reserve != null ? '#AS-' + reserve.reserveNo : '-'}">-</span>
        </div>

        <ul class="summary-list">
          <li>
            <!-- reserve(예약)에는 회원 이름 컬럼이 없어서(memId만 있음),
                 이미 로그인된 사람의 예약이라는 전제하에 세션의 로그인 정보에서 이름을 꺼내 씀.
                 (user_header.html이 헤더에 이름 띄울 때 쓰는 방식과 동일). -->
            <span class="label">고객명</span>
            <span class="value" th:text="${session.loginInfo != null ? session.loginInfo.memName + ' 님' : '-'}">-</span>
          </li>
          <li>
            <span class="label">요청 제품</span>
            <span class="value" th:text="${reserve != null ? reserve.modelName : '-'}">-</span>
          </li>
          <li class="highlight">
            <span class="label">방문 일시</span>
            <span class="value"
                  th:text="${reserve != null ? #temporals.format(reserve.reserveDate, 'yyyy년 M월 d일(E) ') + reserve.slotLabel : '-'}">-</span>
          </li>
          <li>
            <span class="label">방문 주소</span>
            <span class="value" th:if="${reserve != null}">
              <span th:text="${reserve.visitAddr}">서울 강남구 테헤란로 123</span><br>
              <span class="sub" th:text="${reserve.visitAddrDetail}">강남아파트 101동 202호</span>
            </span>
            <span class="value" th:if="${reserve == null}">-</span>
          </li>
        </ul>
      </div>

      <div class="btn-div">
        <a href="/" class="btn btn-secondary btn-lg">홈으로 돌아가기</a>
        <a href="/reserve/list" class="btn btn-primary btn-lg">내 예약 확인하기</a>
      </div>
    </div>
  </div>
</th:block>

<!--이 곳에 script태그로 js파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_js">
</th:block>
</html>
