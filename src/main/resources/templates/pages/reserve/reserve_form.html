<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<!--이 곳에 link태그로 css파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_form.css">
</th:block>

<!--아래 block에 html 코드 작성-->
<th:block layout:fragment="content">
  <div class="reserve-page">

    <!-- 좌측 : 단계 표시 -->
    <aside class="reserve-side">
      <h2>A/S 예약 신청</h2>
      <p>빠르고 정확한 방문을 위해<br>상세한 정보를 입력해주세요.</p>

      <ul class="steps">
        <li class="step step--active">
          <div class="step__marker">1</div>
          <div>
            <h3 class="step__title">증상 접수</h3>
            <p class="step__desc">고장난 기기와 증상을 알려주세요.</p>
          </div>
        </li>
        <li class="step step--upcoming">
          <div class="step__marker">2</div>
          <div>
            <h3 class="step__title">시간 선택</h3>
            <p class="step__desc">원하는 방문 시간을 골라주세요.</p>
          </div>
        </li>
        <li class="step step--upcoming">
          <div class="step__marker">3</div>
          <div>
            <h3 class="step__title">예약 완료</h3>
            <p class="step__desc">엔지니어 배정이 시작됩니다.</p>
          </div>
        </li>
      </ul>
    </aside>

    <!-- 우측 : 폼 본문 -->
    <div class="reserve-main">
      <form action="/reserve/form-submit" method="post" id="reserve-form">
        <div class="card card-lg">
          <!-- Q1. 기기 선택 -->
          <section class="form-section">
            <h3><span class="q-mark">Q.</span> 어떤 기기에 문제가 있나요?</h3>
            
            <div class="cate-tab">
              <button type="button" class="tab active" name="productType" value="냉방">냉방 기기</button>
              <button type="button" class="tab" name="productType"  value="냉방">난방 기기</button>
            </div>
            <div class="product-grid">
              <label class="radio-card">
                <input type="radio" name="categoryNo" value="1" class="radio-card__input" checked>
                <div class="radio-card__body product-card">
                  <i class="bi bi-snow2"></i>
                  <span>에어컨</span>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="categoryNo" value="2" class="radio-card__input">
                <div class="radio-card__body product-card">
                  <i class="bi bi-fan"></i>
                  <span>실외기</span>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="categoryNo" value="4" class="radio-card__input">
                <div class="radio-card__body product-card">
                  <i class="bi bi-wind"></i>
                  <span>제습</span>
                </div>
              </label>
              <label class="radio-card">
                <input type="radio" name="categoryNo" value="5" class="radio-card__input">
                <div class="radio-card__body product-card">
                  <i class="bi bi-three-dots"></i>
                  <span>기타 기기</span>
                </div>
              </label>
            </div>
            <p id="productP" class="valigate-p invalid"></p>
          </section>
          <hr class="divider">

          <!-- Q2. 증상 -->
          <section class="form-section">
            <h3><span class="q-mark">Q.</span> 고장 증상을 상세히 알려주세요. <span class="req">*</span></h3>
            <p class="form-desc">자세히 적어주시면 정확한 부품 준비와 빠른 수리에 도움이 됩니다.</p>
            <textarea class="form-control" name="symptom"
              placeholder="예시)&#10;- 전원이 아예 켜지지 않아요.&#10;- 실외기는 돌아가는데 미지근한 바람만 나옵니다.&#10;- 작동 중에 '덜덜덜' 하는 큰 소음이 발생해요."></textarea>
            <p id="symptomP" class="valigate-p invalid"></p>
          </section>

          <!-- 사진 첨부 -->
          <section class="form-section">
            <h3 class="sub-h3">현장 사진이 있다면 첨부해주세요 (선택)</h3>
            <label for="attach">
              <div class="file-dropzone">
                <div class="file-dropzone__icon"><i class="bi bi-camera-fill"></i></div>
                <p class="drop-title">클릭하거나 사진을 이곳으로 드래그 하세요.</p>
                <p class="drop-desc">에러 코드가 표시된 디스플레이, 파손 부위 등 (최대 3장)</p>
                <input type="file" style="display: none;" id="attach">
              </div>
            </label>
          </section>

          <hr class="divider">

          <!-- 주소 확인 -->
          <section class="form-section">
            <h3>방문 주소 확인</h3>
            <div class="addr-box">
              <div class="addr-info">
                <div class="addr-icon"><i class="bi bi-house-fill"></i></div>
                <div>
                  <div class="addr-tag">
                    <span class="badge badge-gray">기본 주소</span>
                    <span class="zip">06234</span>
                  </div>
                  <div class="addr-box-div">
                    <input type="text" class="addr-main" id="newAddr" name="visitAddr" th:value="${memberAddr.addr}">
                    <input type="text" class="addr-sub" id="newAddrDetail" name="visitAddrDetail" th:value="${memberAddr.addrDetail}">
                  </div>
                </div>
                <input type="hidden" name="memId" th:value="${memberAddr.memId}">
              </div>
              <button type="button" class="btn btn-secondary btn-md" onclick="searchPostCode()">주소 변경</button>
            </div>
          </section>

          <!-- 하단 버튼 -->
          <div class="form-footer">
            <a href="/" class="btn btn-ghost btn-md">이전 단계</a>
            <button type="button" class="btn btn-primary btn-lg" onclick="goReserveStep2()">
              시간 선택하기 <i class="bi bi-arrow-right"></i>
            </button>
          </div>

        </div>
      </form>
    </div>
  </div>
</th:block>

<!--이 곳에 script태그로 js파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_js">
  <script src="/js/pages/reserve/reserve_form.js"></script>
  <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</th:block>
</html>
