<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<!--이 곳에 link태그로 css파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_list.css">
</th:block>

<!--아래 block에 html 코드 작성-->
<th:block layout:fragment="content">
  <div class="mypage">

    <!-- 좌측 : 마이페이지 사이드 -->
    <aside class="my-side">
      <div class="card card-lg my-side-inner">
        <div class="my-profile">
          <img src="https://placehold.co/100x100/e2e8f0/64748b?text=U">
          <div>
            <h2>김고객</h2>
            <p>user@asfast.com</p>
          </div>
        </div>

        <p class="section-label">나의 활동</p>
        <ul class="side-menu">
          <li><a class="active" href="/reserve/list"><i class="bi bi-list-check"></i> 예약 내역 조회</a></li>
          <li><a href="/review/list"><i class="bi bi-star"></i> 작성한 리뷰</a></li>
        </ul>

        <p class="section-label">계정 설정</p>
        <ul class="side-menu">
          <li><a href="/member/edit"><i class="bi bi-person"></i> 회원 정보 수정</a></li>
          <li><a href="/member/addr"><i class="bi bi-geo-alt-fill"></i> 주소지 관리</a></li>
        </ul>
      </div>
    </aside>

    <!-- 우측 : 리스트 본문 -->
    <div class="my-main">
      <h1>예약 내역 조회</h1>

      <!-- 탭 -->
      <ul class="tab-list">
        <li class="tab-active">
          진행 중인 예약 <span class="tab-count">1</span>
        </li>
        <li>
          완료된 내역 <span class="tab-count gray">3</span>
        </li>
        <li>취소 내역</li>
      </ul>

      <!-- 예약 카드 리스트 -->
      <div class="reserve-list">

        <!-- 카드 1 : 진행 중 (이동 중) -->
        <div class="reserve-item card card-lg" onclick="location.href='/reserve/detail/98274'">
          <span class="line-orange"></span>
          <div class="reserve-item__body">
            <div class="product-icon-lg"><i class="bi bi-snow2"></i></div>
            <div class="reserve-item__info">
              <div class="tag-row">
                <span class="badge badge-orange animate-pulse">
                  <i class="bi bi-truck"></i> 기사 이동 중
                </span>
                <span class="time-chip">오늘 15:30 예정</span>
              </div>
              <h3>벽걸이 에어컨 수리</h3>
              <p class="addr"><i class="bi bi-geo-alt-fill"></i> 서울 강남구 테헤란로 123...</p>
            </div>
          </div>
          <div class="reserve-item__driver">
            <div class="driver-info">
              <img src="https://placehold.co/100x100/e2e8f0/64748b?text=KIM">
              <div>
                <p class="name">김철수 엔지니어</p>
                <p class="rate">
                  <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                  <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                  <i class="bi bi-star-fill"></i>
                </p>
              </div>
            </div>
            <span class="arrow-icon"><i class="bi bi-chevron-right"></i></span>
          </div>
        </div>

        <!-- 카드 2 : 기사 배정 완료 -->
        <div class="reserve-item card card-lg" onclick="location.href='/reserve/detail/98275'">
          <span class="line-blue"></span>
          <div class="reserve-item__body">
            <div class="product-icon-lg gray"><i class="bi bi-thermometer-high"></i></div>
            <div class="reserve-item__info">
              <div class="tag-row">
                <span class="badge badge-primary">
                  <i class="bi bi-person-check"></i> 기사 배정 완료
                </span>
                <span class="time-chip">9월 12일 (토) 14:00 예정</span>
              </div>
              <h3>가스 보일러 점검</h3>
              <p class="addr"><i class="bi bi-geo-alt-fill"></i> 서울 강남구 테헤란로 123...</p>
            </div>
          </div>
          <div class="reserve-item__driver only-arrow">
            <span class="arrow-icon"><i class="bi bi-chevron-right"></i></span>
          </div>
        </div>

      </div>
    </div>
  </div>
</th:block>

<!--이 곳에 script태그로 js파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_js">
</th:block>
</html>
