<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_list.css">
</th:block>

<th:block layout:fragment="content">
  <div class="mypage">

    <!-- 좌측 : 마이페이지 사이드 -->
    <aside class="my-side">
      <div class="card card-lg my-side-inner">
        <div class="my-profile">
          <img src="https://placehold.co/100x100/e2e8f0/64748b?text=U">
          <div>
            <!-- 로그인 정보가 있으면 실제 이름, 없으면 임시값 -->
            <h2 th:text="${session.loginInfo != null ? session.loginInfo.memName : '김고객'}">김고객</h2>
            <p th:text="${session.loginInfo != null ? session.loginInfo.memId : 'user1'}">user1</p>
          </div>
        </div>

        <p class="section-label">나의 활동</p>
        <ul class="side-menu">
          <li><a class="active" href="/reserve/list"><i class="bi bi-list-check"></i> 예약 내역 조회</a></li>
          <li><a href="/review/list"><i class="bi bi-star"></i> 작성한 리뷰</a></li>
        </ul>

        <p class="section-label">계정 설정</p>
        <ul class="side-menu">
          <li><a href="/member/edit"><i class="bi bi-person"></i> 회원 정보 수정</a></li>
          <li><a href="/member/addr"><i class="bi bi-geo-alt-fill"></i> 주소지 관리</a></li>
        </ul>
      </div>
    </aside>

    <!-- 우측 : 리스트 본문 -->
    <div class="my-main">
      <h1>예약 내역 조회</h1>

      <!-- 탭 -->
      <ul class="tab-list" id="tabList">
        <li class="tab-active" data-tab="active" onclick="filterTab('active', this)">
          진행 중인 예약 <span class="tab-count" th:text="${activeCount}">0</span>
        </li>
        <li data-tab="done" onclick="filterTab('done', this)">
          완료된 내역 <span class="tab-count gray" th:text="${doneCount}">0</span>
        </li>
        <li data-tab="cancel" onclick="filterTab('cancel', this)">
          취소 내역 <span class="tab-count gray" th:text="${cancelCount}">0</span>
        </li>
      </ul>

      <!-- 예약 카드 리스트 -->
      <div class="reserve-list" id="reserveList">

        <!-- 예약이 아예 없는 경우 -->
        <div th:if="${#lists.isEmpty(reserves)}" class="empty-state">
          <i class="bi bi-inbox"></i>
          <p>아직 예약 내역이 없습니다.</p>
          <a href="/reserve/form" class="btn btn-primary btn-md">A/S 예약하기</a>
        </div>

        <!-- 예약 카드 반복 -->
        <div th:each="r : ${reserves}"
             th:data-status="${r.reserveStatus}"
             class="reserve-item card card-lg"
             th:onclick="|location.href='/reserve/detail/' + ${r.reserveNo}|">

          <!-- 상태별 좌측 강조 라인 -->
          <span th:if="${r.reserveStatus == '2'}" class="line-orange"></span>
          <span th:if="${r.reserveStatus == '9'}" class="line-blue"></span>
          <span th:if="${r.reserveStatus == 'C'}" class="line-gray"></span>
          <span th:if="${r.reserveStatus == '0' or r.reserveStatus == '1'}" class="line-blue"></span>

          <div class="reserve-item__body">
            <!-- 카테고리에 따라 아이콘 분기 (냉방: 눈송이 / 난방: 온도계) -->
            <div class="product-icon-lg"
                 th:classappend="${r.reserveStatus == '9' or r.reserveStatus == 'C'} ? ' gray' : ''">
              <i class="bi"
                 th:classappend="${r.productType == '난방'} ? ' bi-thermometer-high' : ' bi-snow2'"></i>
            </div>

            <div class="reserve-item__info">
              <div class="tag-row">
                <!-- 상태 배지 (th:switch) -->
                <th:block th:switch="${r.reserveStatus}">
                  <span th:case="'0'" class="badge badge-primary">
                    <i class="bi bi-hourglass-split"></i> 예약 접수
                  </span>
                  <span th:case="'1'" class="badge badge-primary">
                    <i class="bi bi-person-check"></i> 기사 배정 완료
                  </span>
                  <span th:case="'2'" class="badge badge-orange animate-pulse">
                    <i class="bi bi-truck"></i> 기사 이동 중
                  </span>
                  <span th:case="'9'" class="badge badge-green">
                    <i class="bi bi-check-lg"></i> 수리 완료
                  </span>
                  <span th:case="'C'" class="badge badge-gray">
                    <i class="bi bi-x-lg"></i> 취소됨
                  </span>
                </th:block>

                <!-- 방문 예정 일시 -->
                <span class="time-chip"
                      th:text="|${#temporals.format(r.reserveDate, 'M월 d일 (E)')} ${r.slotLabel}|">
                  9월 12일 (금) 10:00 ~ 12:00
                </span>
              </div>

              <h3 th:text="${r.modelName}">삼성 무풍 에어컨</h3>
              <p class="addr">
                <i class="bi bi-geo-alt-fill"></i>
                <span th:text="${r.visitAddr} + ' ' + ${r.visitAddrDetail}">주소</span>
              </p>
            </div>
          </div>

          <!-- 우측 (기사 배정 전이면 화살표만) -->
          <div class="reserve-item__driver only-arrow">
            <span class="arrow-icon"><i class="bi bi-chevron-right"></i></span>
          </div>
        </div>

        <!-- 탭 필터 결과 없음 안내  -->
        <div id="tabEmpty" class="empty-state" style="display:none;">
          <i class="bi bi-inbox"></i>
          <p>이 탭에 해당하는 예약이 없습니다.</p>
        </div>

      </div>
    </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="/js/pages/reserve/reserve_list.js"></script>
</th:block>
</html>
