<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/user_layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/reserve/reserve_list.css">
</th:block>

<th:block layout:fragment="content">
  <div class="mypage">

    <div class="my-main">
      <h1>예약 내역 조회</h1>

      <!-- 탭 -->
      <ul class="tab-list" id="tabList">
        <li class="tab-active" data-tab="active" onclick="filterTab('active', this)">
          진행 중인 예약
        </li>
        <li data-tab="done" onclick="filterTab('done', this)">
          완료된 내역
        </li>
        <li data-tab="cancel" onclick="filterTab('cancel', this)">
          취소 내역
        </li>
      </ul>

      <!-- 예약 카드 리스트 -->
      <div class="reserve-list" id="reserveList">

        <!-- 예약이 아예 없는 경우 -->
        <div th:if="${#lists.isEmpty(reserves)}" class="empty-state">
          <i class="bi bi-inbox"></i>
          <p>아직 예약 내역이 없습니다.</p>
          <a href="/reserve/form" class="btn btn-primary btn-md">A/S 예약하기</a>
        </div>

        <!-- 예약 카드 반복 (카드 클릭 이동 없음) -->
        <div th:each="r : ${reserves}"
             th:data-status="${r.reserveStatus}"
             class="reserve-item card card-lg">

          <!-- 상태별 좌측 강조 라인 -->
          <span th:if="${r.reserveStatus == '9'}" class="line-blue"></span>
          <span th:if="${r.reserveStatus == 'C'}" class="line-gray"></span>
          <span th:if="${r.reserveStatus == '0' or r.reserveStatus == '1'}" class="line-blue"></span>

          <!-- 카드 상단: 아이콘 + 정보 -->
          <div class="reserve-item__main">
            <div class="reserve-item__body">
              <div class="product-icon-lg"
                   th:classappend="${r.reserveStatus == '9' or r.reserveStatus == 'C' ? 'gray' : ''}">
                <i class="bi"
                   th:classappend="${r.productType == '난방' ? 'bi-thermometer-high' : 'bi-snow2'}"></i>
              </div>

              <div class="reserve-item__info">
                <div class="tag-row">
                  <th:block th:switch="${r.reserveStatus}">
                    <span th:case="'0'" class="badge badge-primary">
                      <i class="bi bi-hourglass-split"></i> 예약 접수
                    </span>
                    <span th:case="'1'" class="badge badge-primary">
                      <i class="bi bi-person-check"></i> 기사 배정 완료
                    </span>
                    <span th:case="'9'" class="badge badge-green">
                      <i class="bi bi-check-lg"></i> 수리 완료
                    </span>
                    <span th:case="'C'" class="badge badge-gray">
                      <i class="bi bi-x-lg"></i> 취소됨
                    </span>
                  </th:block>

                  <span class="time-chip"
                        th:text="|${#temporals.format(r.reserveDate, 'M월 d일 (E)')} ${r.slotLabel}|">
                  </span>
                </div>

                <h3 th:text="${r.modelName}">삼성 무풍 에어컨</h3>
                <p class="addr">
                  <i class="bi bi-geo-alt-fill"></i>
                  <span th:text="${r.categoryName} + ' · ' + ${r.visitAddr} + ' ' + ${r.visitAddrDetail}"></span>
                </p>
              </div>
            </div>
          </div>

          <!-- 하단: 상태 정보(좌) + 버튼(우) -->
          <div class="reserve-bottom">

            <div class="bottom-left">
              <th:block th:if="${r.reserveStatus == '9'}">
                <div class="done-info">
                  <i class="bi bi-check-circle-fill"></i>
                  <span th:text="${#temporals.format(r.reserveDate, 'yyyy년 M월 d일')} + ' 완료'">
                    2026년 8월 20일 완료
                  </span>
                </div>
              </th:block>
              <th:block th:if="${r.reserveStatus == 'C'}">
                <div class="cancel-info">
                  <i class="bi bi-x-circle"></i>
                  <span>취소된 예약입니다.</span>
                </div>
              </th:block>
            </div>

            <div class="bottom-right">
              <!-- 예약 취소 (진행 중 상태만) -->
              <button type="button"
                      class="btn btn-secondary btn-sm"
                      th:if="${r.reserveStatus == '0' or r.reserveStatus == '1'}"
                      th:onclick="|cancelReserve(${r.reserveNo})|">
                <i class="bi bi-x-circle"></i> 예약 취소
              </button>
              <!-- 리뷰 작성 (완료 탭만) -->
              <button type="button"
                      class="btn btn-secondary btn-sm"
                      th:if="${r.reserveStatus == '9'}"
                      onclick="location.href='/review/write';">
                <i class="bi bi-star"></i> 리뷰 작성
              </button>

              <!-- 상세정보 토글 -->
              <button type="button"
                      class="btn btn-secondary btn-sm btn-symptom"
                      onclick="toggleSymptom(this);">
                <i class="bi bi-chevron-down"></i> 상세정보
              </button>
            </div>

          </div>

          <!-- 상세정보 펼침 영역 (초기 숨김) -->
          <div class="reserve-symptom-panel">
            <span class="detail-label">상세 정보</span>
            <textarea class="symptom-textarea" readonly th:text="${r.symptom}"></textarea>
          </div>

        </div>

        <!-- 탭 필터 결과 없음 안내 (JS) -->
        <div id="tabEmpty" class="empty-state" style="display:none;">
          <i class="bi bi-inbox"></i>
          <p>이 탭에 해당하는 예약이 없습니다.</p>
        </div>

      </div>
    </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="/js/pages/reserve/reserve_list.js"></script>
</th:block>
</html>
